name: Sync derived apps' index.html from root

# 単一ソース維持: ルートの index.html を唯一の編集元とし、
# 変更時に派生アプリのサブフォルダ (legal/index.html, law/index.html, mount/index.html) へ自動コピーする。
# これにより共通コードの改修が両アプリへ確実に反映され、コピーの乖離を防ぐ。
# 注意: 各フォルダの config.js（部署固有設定）は対象外。上書きしない。

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy root index.html into legal/, law/ and mount/
        run: |
          mkdir -p legal law mount
          cp index.html legal/index.html
          cp index.html law/index.html
          cp index.html mount/index.html

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- legal/index.html law/index.html mount/index.html; then
            echo "派生アプリの index.html は最新。コミット不要。"
          else
            git add legal/index.html law/index.html mount/index.html
            git commit -m "chore: sync derived apps' index.html from root index.html"
            git push
          fi
